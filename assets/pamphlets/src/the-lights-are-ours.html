<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:854px;height:480px;overflow:hidden;background:#14120e;}
  body{font-family:'Courier New',monospace;color:#e8e4d8;position:relative;}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.6;
    background:repeating-linear-gradient(1deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px);}
  .bulb{position:absolute;left:640px;top:70px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,#f0d87a,#c8a93a 55%,transparent 72%);
    box-shadow:0 0 90px 40px rgba(240,216,122,.25);}
  h1{font-family:Impact,'Arial Black',sans-serif;font-size:84px;line-height:.92;margin:44px 40px 0;max-width:560px;transform:rotate(-1deg);}
  h1 .y{color:#f0d87a;}
  .body{margin:24px 44px 0;font-size:20px;line-height:1.6;max-width:560px;}
  .body b{border-bottom:3px solid #f0d87a;}
  .sig{position:absolute;right:40px;bottom:28px;font-family:Impact,sans-serif;font-size:26px;
    color:#14120e;background:#e8e4d8;padding:4px 14px;transform:rotate(1.6deg);}
  .safe{position:absolute;left:0;top:0;width:854px;height:480px;transform:scale(.72);transform-origin:50% 50%;}
  .dirt{position:absolute;left:0;top:0;width:854px;height:480px;pointer-events:none;mix-blend-mode:multiply;
    background:
      radial-gradient(120% 95% at 50% 45%, rgba(58,45,26,0) 48%, rgba(58,45,26,.55) 100%),
      radial-gradient(230px 170px at 10% 90%, rgba(88,66,36,.34), transparent 70%),
      radial-gradient(270px 190px at 90% 8%, rgba(88,66,36,.30), transparent 70%),
      radial-gradient(170px 130px at 76% 84%, rgba(104,80,42,.26), transparent 70%),
      radial-gradient(210px 150px at 28% 6%, rgba(76,58,32,.22), transparent 70%),
      radial-gradient(90px 60px at 55% 30%, rgba(90,70,40,.18), transparent 70%),
      linear-gradient(rgba(122,96,56,.42), rgba(122,96,56,.42));}
</style></head><body>
  <div class="safe">
  <div class="bulb"></div>
  <h1>THE <span class="y">LIGHTS</span> ARE OURS</h1>
  <div class="body">
    Every wire on this island went in with our hands.<br>
    Every switch. Every pole. Every humming box they fenced off.<br><br>
    They kept the paychecks. <b>We keep the grid.</b><br>
    If it glows, it was never theirs to bill.
  </div>
  <div class="sig">THE UNPAID</div>
  </div>
  <div class="grain"></div>
  <div class="dirt"></div>
</body></html>
