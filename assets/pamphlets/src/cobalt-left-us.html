<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:854px;height:480px;overflow:hidden;background:#e9e6dd;}
  body{font-family:'Courier New',monospace;color:#181512;position:relative;}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(3deg,transparent 0 3px,rgba(0,0,0,.03) 3px 4px),
               repeating-linear-gradient(94deg,transparent 0 7px,rgba(0,0,0,.025) 7px 8px);}
  .smudge{position:absolute;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,0,0,.08),transparent 70%);}
  h1{font-family:Impact,'Arial Black',sans-serif;font-size:92px;line-height:.9;margin:34px 40px 6px;
    letter-spacing:.01em;transform:rotate(-1.2deg);}
  h1 .x{color:#a3241a;}
  .body{margin:18px 44px 0;font-size:21px;line-height:1.5;max-width:600px;transform:rotate(-.4deg);}
  .body b{background:#181512;color:#e9e6dd;padding:0 6px;}
  .sig{position:absolute;right:44px;bottom:30px;font-family:Impact,'Arial Black',sans-serif;
    font-size:30px;transform:rotate(-2deg);border:4px solid #181512;padding:4px 16px;}
  .stamp{position:absolute;left:610px;top:40px;font-family:Impact,sans-serif;font-size:17px;color:#a3241a;
    border:3px double #a3241a;padding:6px 10px;transform:rotate(8deg);opacity:.85;text-align:center;line-height:1.2;}
  .safe{position:absolute;left:0;top:0;width:854px;height:480px;transform:scale(.72);transform-origin:50% 50%;}
  .dirt{position:absolute;left:0;top:0;width:854px;height:480px;pointer-events:none;mix-blend-mode:multiply;
    background:
      radial-gradient(120% 95% at 50% 45%, rgba(58,45,26,0) 48%, rgba(58,45,26,.55) 100%),
      radial-gradient(230px 170px at 10% 90%, rgba(88,66,36,.34), transparent 70%),
      radial-gradient(270px 190px at 90% 8%, rgba(88,66,36,.30), transparent 70%),
      radial-gradient(170px 130px at 76% 84%, rgba(104,80,42,.26), transparent 70%),
      radial-gradient(210px 150px at 28% 6%, rgba(76,58,32,.22), transparent 70%),
      radial-gradient(90px 60px at 55% 30%, rgba(90,70,40,.18), transparent 70%),
      linear-gradient(rgba(122,96,56,.42), rgba(122,96,56,.42));}
</style></head><body>
  <div class="safe">
  <div class="smudge" style="left:-60px;top:300px;"></div>
  <div class="smudge" style="left:700px;top:-70px;"></div>
  <h1>COBALT<br><span class="x">LEFT US</span> HERE</h1>
  <div class="stamp">PRINT №1<br>PASS IT ON</div>
  <div class="body">
    The evacuation manifest had <b>40 seats</b>.<br>
    There were <b>two hundred of us</b> on the ground.<br><br>
    Do the math. They already did.
  </div>
  <div class="sig">THE UNPAID</div>
  </div>
  <div class="grain"></div>
  <div class="dirt"></div>
</body></html>
