<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:854px;height:480px;overflow:hidden;background:#e9e5da;}
  body{font-family:'Courier New',monospace;color:#161310;position:relative;}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(4deg,transparent 0 4px,rgba(0,0,0,.03) 4px 5px);}
  h1{font-family:Impact,'Arial Black',sans-serif;font-size:104px;margin:30px 0 0;text-align:center;
    letter-spacing:.02em;transform:rotate(-.8deg);}
  .strike{position:relative;display:inline-block;}
  .strike::after{content:"";position:absolute;left:-12px;right:-12px;top:56%;height:10px;background:#a3241a;transform:rotate(-1.5deg);}
  .body{margin:18px auto 0;font-size:20px;line-height:1.5;max-width:620px;text-align:center;}
  .body b{background:#161310;color:#e9e5da;padding:0 6px;}
  .shovel{position:absolute;left:60px;bottom:30px;font-size:15px;letter-spacing:.2em;transform:rotate(-3deg);}
  .sig{position:absolute;right:52px;bottom:26px;font-family:Impact,sans-serif;font-size:24px;transform:rotate(1.2deg);
    border:4px solid #161310;padding:3px 12px;}
  .safe{position:absolute;left:0;top:0;width:854px;height:480px;transform:scale(.72);transform-origin:50% 50%;}
  .dirt{position:absolute;left:0;top:0;width:854px;height:480px;pointer-events:none;mix-blend-mode:multiply;
    background:
      radial-gradient(120% 95% at 50% 45%, rgba(58,45,26,0) 48%, rgba(58,45,26,.55) 100%),
      radial-gradient(230px 170px at 10% 90%, rgba(88,66,36,.34), transparent 70%),
      radial-gradient(270px 190px at 90% 8%, rgba(88,66,36,.30), transparent 70%),
      radial-gradient(170px 130px at 76% 84%, rgba(104,80,42,.26), transparent 70%),
      radial-gradient(210px 150px at 28% 6%, rgba(76,58,32,.22), transparent 70%),
      radial-gradient(90px 60px at 55% 30%, rgba(90,70,40,.18), transparent 70%),
      linear-gradient(rgba(122,96,56,.42), rgba(122,96,56,.42));}
</style></head><body>
  <div class="safe">
  <h1><span class="strike">SEVERANCE</span></h1>
  <div class="body">
    They owe every one of us. They wrote it down, then they wrote us off.<br><br>
    But people bury what they can't carry —<br>
    and this island is <b>full of holes with lids</b>.<br><br>
    Keep digging.
  </div>
  <div class="shovel">BRING A SHOVEL. BRING A FRIEND. TELL NOBODY ELSE.</div>
  <div class="sig">THE UNPAID</div>
  </div>
  <div class="grain"></div>
  <div class="dirt"></div>
</body></html>
